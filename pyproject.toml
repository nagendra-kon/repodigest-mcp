[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repodigest-mcp"
version = "0.1.0"
description = "MCP server exposing RepoDigest's AST signatures, call graph and token-budgeted context packing"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer (mcp.server.mcpserver); 1.x has no such module.
    "mcp>=2.0",
    "repodigest",
    "click",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repodigest-mcp = "repodigest_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
